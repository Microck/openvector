<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenVector Wasm prototype</title>
<style>
:root{color-scheme:dark}body{background:#000;color:white;font:16px system-ui;max-width:60rem;margin:4vh auto;padding:1rem}img{display:block;max-width:100%;max-height:60vh;background:#777}a{color:white}
</style>
<h1>OpenVector</h1><label>Trace a PNG <input id="file" type="file" accept="image/png" disabled></label>
<p id="status" role="status">Loading engine…</p><img id="preview" hidden alt="Traced vector"><p><a id="save" hidden>Download SVG</a></p>
<script>
const source = /* WORKER */ null;
const scriptURL = URL.createObjectURL(new Blob([source], {type:'text/javascript'}));
const worker = new Worker(scriptURL);
const file = document.querySelector('#file'), statusLine = document.querySelector('#status');
const save = document.querySelector('#save'), preview = document.querySelector('#preview');
worker.onerror = e => { file.disabled = true; URL.revokeObjectURL(scriptURL); statusLine.textContent = e.message; };
worker.onmessage = ({data}) => {
  file.disabled = false;
  if (data.ready) { URL.revokeObjectURL(scriptURL); statusLine.textContent = 'Ready'; return; }
  if (data.error) { statusLine.textContent = data.error; return; }
  const url = URL.createObjectURL(new Blob([data.svg], {type:'image/svg+xml'}));
  save.href = preview.src = url;
  save.download = file.files[0].name.replace(/\.png$/i,'') + '.svg';
  preview.hidden = save.hidden = false;
  statusLine.textContent = data.ms.toFixed(1) + ' ms · ' + data.svg.length + ' bytes';
};
file.onchange = async () => {
  const image = file.files[0];
  if (!image) return;
  file.disabled = true;
  if (save.href) URL.revokeObjectURL(save.href);
  preview.hidden = save.hidden = true;
  statusLine.textContent = 'Tracing…';
  const buffer = await image.arrayBuffer();
  worker.postMessage(buffer, [buffer]);
};
</script></html>
