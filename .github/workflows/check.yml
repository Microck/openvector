name: source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Reference smoke checks
        run: npm run test:smoke
      - name: Check JavaScript syntax
        shell: bash
        run: find npm bin src tools test -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Inspect source package inventory without building
        run: npm pack --ignore-scripts --dry-run
