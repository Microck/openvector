[workspace]
resolver = "2"
members = ["crates/openvector", "crates/openvector-cli", "crates/openvector-gui", "crates/openvector-node"]
exclude = ["vendor/gpui", "vendor/gpui_linux", "vendor/gpui_macos", "vendor/gpui_wgpu", "vendor/gpui_windows", "vendor/gpui_apple"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[profile.test]
opt-level = 2

[workspace.dependencies]
# Zed GPUI pinned by exact revision (2026-10-20); see docs/rust-port-contract.json upstream.versionDecision.
gpui = { git = "https://github.com/zed-industries/zed", rev = "b0f1e1cb2f4be4c7df054f96a2a2721aa878ba6c" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "b0f1e1cb2f4be4c7df054f96a2a2721aa878ba6c", default-features = false, features = ["font-kit", "wayland", "x11"] }

# Zed's workspace patches that its GPUI crates rely on; git dependencies do not inherit them.
[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

# Maintained renderer and native export-drag fixes use the same pinned upstream sources.
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "vendor/gpui" }
gpui_linux = { path = "vendor/gpui_linux" }
gpui_macos = { path = "vendor/gpui_macos" }
gpui_wgpu = { path = "vendor/gpui_wgpu" }
gpui_windows = { path = "vendor/gpui_windows" }
gpui_apple = { path = "vendor/gpui_apple" }
