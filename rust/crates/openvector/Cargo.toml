[package]
name = "openvector"
description = "Independent raster-to-vector engine; Rust port of the verified OpenVector reference."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
num-bigint = "0.4"
num-traits = "0.2"
flate2 = "1"
libc = "0.2"

[build-dependencies]
cc = "1"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
flate2 = "1"
base64 = "0.22"
tempfile = "3"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14"

[target.'cfg(not(unix))'.dependencies]
same-file = "1.0"
