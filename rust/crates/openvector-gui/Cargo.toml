[package]
name = "openvector-gui"
description = "OpenVector desktop application (GPUI)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "openvector-gui"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
openvector = { path = "../openvector" }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = "0.25"
unicode-segmentation = "1.12"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
flate2 = "1"
base64 = "0.22"

[target.'cfg(target_os = "wasi")'.dependencies]
gpui_web = { git = "https://github.com/zed-industries/zed", rev = "b0f1e1cb2f4be4c7df054f96a2a2721aa878ba6c", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
