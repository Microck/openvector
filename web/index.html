  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17181b;color:#e4e5e7}canvas{display:block}</style>
  <style>
    /* The repository and Sponsors links sit centred in the empty middle of GPUI's 38px toolbar. Below 600px the
       toolbar's left and right button groups can reach the centre, so the links are hidden there. */
    #project-links { display: none }
    @media (min-width: 600px) {
      #project-links { display: flex; gap: 4px; position: fixed; z-index: 1; top: 3px; left: 50%; transform: translateX(-50%) }
      #project-links a { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 6px; color: #abb0ba }
      #project-links a:hover, #project-links a:focus-visible { color: #e4e5e7; background: #2a2b30 }
      #project-links a[href*="sponsors"]:hover, #project-links a[href*="sponsors"]:focus-visible { color: #db61a2 }
    }
    #opening-sponsor { display: none }
    @media (min-width: 680px) and (min-height: 420px) {
      body:has(canvas) #opening-sponsor {
        display: block; position: fixed; z-index: 1; bottom: 58px; left: 100px; right: 336px;
        text-align: center; color: #abb0ba; font: 13px/1.5 system-ui, sans-serif;
        pointer-events: none;
      }
      #opening-sponsor a { color: inherit; pointer-events: auto }
    }
  </style>
</head>
<body>

  <!-- Unbooked, the slot invites sponsors to get in touch. To book it, replace the contents with
       `Advertisement · <a rel="sponsored noopener noreferrer" target="_blank" href="https://...">text</a>`. -->
  <aside id="opening-sponsor" aria-label="Sponsorship">
    <a href="mailto:sponsor@openvector.app?subject=Sponsoring%20OpenVector">Want your product here? Sponsor OpenVector</a>
  </aside>
  <script type="module">
    // The slot leaves on the first editor interaction, except a click or Enter on its own link.
    const sponsor = document.querySelector('#opening-sponsor');
    const events = new AbortController();
    function dismiss(event) {
      if (event.key === 'Tab') return;
      if ((event.type === 'pointerdown' || event.key === 'Enter') && event.composedPath().includes(sponsor)) return;
      sponsor.remove();
      events.abort();
    }
    for (const type of ['pointerdown', 'keydown', 'drop', 'paste']) {
      window.addEventListener(type, dismiss, {capture: true, signal: events.signal});
    }
  </script>
  <script type="module" src="openvector.js"></script>
